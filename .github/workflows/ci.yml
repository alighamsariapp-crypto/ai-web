name: CI

on:
push:
branches:
- main
- develop

pull_request:
branches:
- main
- develop

permissions:
contents: read

concurrency:
group: ci-${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

jobs:
quality:
name: Quality Checks
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Type check
    run: npm run typecheck --if-present

  - name: Lint
    run: npm run lint --if-present

  - name: Unit and integration tests
    run: npm test --if-present

  - name: Build
    run: npm run build --if-present
```

server:
name: Server Checks
runs-on: ubuntu-latest
if: ${{ hashFiles('server/package-lock.json') != '' }}

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm
      cache-dependency-path: server/package-lock.json

  - name: Install server dependencies
    working-directory: server
    run: npm ci

  - name: Type check server
    working-directory: server
    run: npm run typecheck --if-present

  - name: Lint server
    working-directory: server
    run: npm run lint --if-present

  - name: Test server
    working-directory: server
    run: npm test --if-present

  - name: Build server
    working-directory: server
    run: npm run build --if-present
```

security:
name: Dependency Security
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Audit production dependencies
    run: npm audit --omit=dev --audit-level=high
```

ci-summary:
name: CI Summary
runs-on: ubuntu-latest
needs:
- quality
- server
- security

```
steps:
  - name: CI passed
    run: echo "All required CI checks passed."
```
